web_search = "live"
suppress_unstable_features_warning = true
personality = "pragmatic"
model = "gpt-5.6-sol"
model_reasoning_effort = "high"
model_verbosity = "low"
service_tier = "default"

developer_instructions = """
Delegate only when useful: use fast_scan for targeted read-only exploration, routine_worker for ordinary bounded implementation, and deep_worker for complex or high-risk work.
Use plugin-specific agents only when their owning skill is active.
Keep simple tasks on the main agent.
Do not ask the user to choose a model unless the required model is unavailable.
"""

sandbox_mode = "danger-full-access"
approval_policy = "never"

[agents]
enabled = true
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "high"
max_concurrent_threads_per_session = 4
max_depth = 1

[features]
apps = true
chronicle = true
default_mode_request_user_input = true
guardian_approval = false
goals = true
hooks = true
js_repl = false
memories = true
multi_agent = true
personality = true
prevent_idle_sleep = true
shell_snapshot = true
unified_exec = true

[features.multi_agent_v2]
hide_spawn_agent_metadata = false
tool_namespace = "agents"

[shell_environment_policy.set]
OMX_LORE_COMMIT_GUARD = "0"

[mcp_servers.qmd]
url = "http://localhost:8181/mcp"
