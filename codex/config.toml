web_search = "live"
suppress_unstable_features_warning = true
personality = "pragmatic"
model = "gpt-6-astra"
model_reasoning_effort = "medium"
model_verbosity = "low"
service_tier = "default"

developer_instructions = """
Use the astra-orchestrate skill for substantial work with independent subtasks or a useful independent review. Keep simple or tightly coupled work on the main agent.
Use plugin-specific agents only when their owning skill is active.
Keep product, permission, release, and other material approvals with the user.
"""

sandbox_mode = "workspace-write"
approval_policy = "on-request"

[agents]
enabled = true
default_subagent_model = "gpt-5.6-sol"
default_subagent_reasoning_effort = "medium"
max_concurrent_threads_per_session = 4
max_depth = 1

[plugins."sol-advisor@sol-advisor"]
enabled = false

[features]
apps = true
chronicle = true
context_management.experimental_mode = true
default_mode_request_user_input = true
guardian_approval = false
goals = true
hooks = true
js_repl = false
memories = true
multi_agent = true
personality = true
prevent_idle_sleep = true
shell_snapshot = true
unified_exec = true

[features.multi_agent_v2]
hide_spawn_agent_metadata = false
tool_namespace = "agents"

[shell_environment_policy.set]
OMX_LORE_COMMIT_GUARD = "0"

[mcp_servers.qmd]
url = "http://localhost:8181/mcp"
